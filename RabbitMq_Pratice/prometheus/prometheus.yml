global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-broker:15692']

  - job_name: 'rabbitmq-queues'
    metrics_path: '/metrics/per-object'
    static_configs:
      - targets: ['rabbitmq-broker:15692']

